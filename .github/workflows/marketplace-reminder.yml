# Public workflows cannot call an internal reusable workflow, and this repo's token cannot
# read that marketplace, so this job reminds a maintainer to open the release PR.
name: Marketplace Reminder

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    name: Remind maintainers about a marketplace bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Update the weekly marketplace reminder
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/marketplace_bump.py remind --repo "$GITHUB_REPOSITORY"
