name: CI - Tests and Linting

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Run Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Show files modified by pre-commit hooks
        if: failure()
        run: |
          echo "::group::Files modified by pre-commit hooks"
          git diff --name-only
          echo "::endgroup::"
          echo "::group::Full diff of modifications"
          git diff
          echo "::endgroup::"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        if: matrix.python-version != '3.12'
        run: pip install pytest==9.1.1

      - name: Run pytest
        if: matrix.python-version != '3.12'
        run: python -m pytest tests/ -q

      - name: Install pytest + coverage (gate leg)
        if: matrix.python-version == '3.12'
        run: |
          pip install "pip>=25.1"
          pip install --group dev

      - name: Run pytest with coverage gate
        if: matrix.python-version == '3.12'
        run: |
          COVERAGE_FILE="$(mktemp -d)/.coverage" python -m pytest tests/ -q \
            --cov=scripts --cov=.github --cov-fail-under=91.3

  workflow-tests:
    name: Run Workflow JS Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Exact patch: coverage percentages move across Node builds; 24.18.0 is
          # the sandboxed runtime / reference build this repo develops against.
          node-version: "24.18.0"

      - name: Run node test suite
        run: |
          LCOV="$(mktemp -d)/js-coverage.lcov" && node --test --experimental-test-coverage \
            --test-coverage-include='workflows/src/*.js' \
            --test-coverage-include='workflows/build.js' \
            --test-coverage-lines=98 \
            --test-coverage-branches=82.3 \
            --test-coverage-functions=97 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination="$LCOV" \
            workflows/test/*.test.js \
            && node workflows/test/tools/check_coverage_presence.mjs "$LCOV"

      - name: Verify committed bundle matches a fresh build
        run: |
          node workflows/build.js
          git diff --exit-code workflows/pipeline.js

  bench-tests:
    name: Run Bench Self-Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        if: matrix.python-version != '3.12'
        run: pip install pytest==9.1.1

      - name: Run bench self-tests
        if: matrix.python-version != '3.12'
        run: python -m pytest bench/tests/ -q

      - name: Install pytest + coverage (gate leg)
        if: matrix.python-version == '3.12'
        run: |
          pip install "pip>=25.1"
          pip install --group dev

      - name: Run bench self-tests with coverage gate
        if: matrix.python-version == '3.12'
        run: |
          COVERAGE_FILE="$(mktemp -d)/.coverage" python -m pytest bench/tests/ -q \
            --cov=bench --cov-fail-under=87
