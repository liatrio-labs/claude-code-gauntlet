name: CI - Tests and Linting

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_live:
        description: Run the approved Windows live runtime probe
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "24.18.0"

jobs:
  lint:
    name: Run Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pre-commit
        run: pip install pre-commit==4.6.1

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Show files modified by pre-commit hooks
        if: failure()
        run: |
          echo "::group::Files modified by pre-commit hooks"
          git diff --name-only
          echo "::endgroup::"
          echo "::group::Full diff of modifications"
          git diff
          echo "::endgroup::"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the dev group
        run: |
          pip install pip==26.2
          pip install --group dev

      - name: Run pytest
        if: matrix.python-version != '3.12'
        run: python -m pytest tests/ -q

      - name: Run pytest with coverage gate
        if: matrix.python-version == '3.12'
        run: |
          COVERAGE_FILE="$(mktemp -d)/.coverage" python -m pytest tests/ -q \
            --cov=scripts --cov=.github --cov-fail-under=94.6

  js-lint:
    name: Run Workflow JS Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Lint workflows JS
        run: python3 workflows/test/tools/biome_check.py

  workflow-tests:
    name: Run Workflow JS Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact patch: coverage percentages move across Node builds; 24.18.0 is
          # the sandboxed runtime / reference build this repo develops against.
          node-version: ${{ env.NODE_VERSION }}

      - name: Run node test suite
        run: |
          LCOV="$(mktemp -d)/js-coverage.lcov" && node --test --experimental-test-coverage \
            --test-coverage-include='workflows/src/*.js' \
            --test-coverage-include='workflows/build.js' \
            --test-coverage-lines=98.6 \
            --test-coverage-branches=91.8 \
            --test-coverage-functions=98.5 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination="$LCOV" \
            workflows/test/*.test.js \
            && node workflows/test/tools/check_coverage_presence.mjs "$LCOV"

      - name: Verify committed bundle matches a fresh build
        run: |
          node workflows/build.js
          git diff --exit-code workflows/pipeline.js

  bench-tests:
    name: Run Bench Self-Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        if: matrix.python-version != '3.12'
        run: pip install pytest==9.1.1

      - name: Run bench self-tests
        if: matrix.python-version != '3.12'
        run: python -m pytest bench/tests/ -q

      - name: Install pytest + coverage (gate leg)
        if: matrix.python-version == '3.12'
        run: |
          pip install pip==26.2
          pip install --group dev

      - name: Run bench self-tests with coverage gate
        if: matrix.python-version == '3.12'
        run: |
          COVERAGE_FILE="$(mktemp -d)/.coverage" python -m pytest bench/tests/ -q \
            --cov=bench --cov-fail-under=88.6

  test-windows:
    name: Run Tests on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the dev group
        shell: bash
        run: |
          python -m pip install pip==26.2
          python -m pip install --group dev
      - name: Run pytest
        shell: bash
        run: python -m pytest tests/ -q

  windows-live:
    name: Windows Live Runtime
    if: github.event_name == 'workflow_dispatch' && inputs.windows_live
    runs-on: windows-latest
    environment: windows-live
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Require subscription token
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is absent from environment windows-live"
            exit 1
          fi
      - name: Checkout dispatched ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record commit
        shell: bash
        run: git rev-parse HEAD
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned Claude Code
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.302
          claude --version
      - name: Review fixture and assert runtime receipts
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: py -3 .github/windows_live.py "$RUNNER_TEMP/windows-live"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-live-runtime
          path: |
            ${{ runner.temp }}/windows-live/artifacts
            ${{ runner.temp }}/windows-live/transcript.jsonl
            ${{ runner.temp }}/windows-live/workflow.output
            ${{ runner.temp }}/windows-live/assertions.json
            ${{ runner.temp }}/windows-live/wf_*.json
          if-no-files-found: warn
