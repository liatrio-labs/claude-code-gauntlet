name: CI - Tests and Linting

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.18.0"

jobs:
  test-windows-baseline:
    name: Windows baseline (py ${{ matrix.python-version }}, PYTHONUTF8=${{ matrix.utf8 }})
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        utf8: ["1"]
    env:
      PYTHONUTF8: ${{ matrix.utf8 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Environment
        shell: bash
        run: |
          git config --get core.autocrlf || true
          python -c "import sys, locale; print(sys.version, locale.getpreferredencoding(False), sys.flags.utf8_mode)"
          which python python3 node bash || true

      - name: Install pytest
        run: pip install pytest==9.1.1

      - name: Run pytest
        run: python -m pytest tests/ -v -rfE --tb=short -p no:cacheprovider --color=no
