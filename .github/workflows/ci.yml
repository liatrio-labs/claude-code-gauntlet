name: CI - Tests and Linting

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.18.0"

jobs:
  redproof:
    name: Windows red proof ${{ matrix.mutation }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mutation: control
            tests: "tests/test_collect_project_rules.py::TestDiscovery::test_windows_style_changed_entry_marks_nested_rule_modified tests/test_agent_instruction_layout.py::TestCollectorDedup tests/test_contribution_surface.py::TestContractFenceHook tests/test_generate_contract_requirements.py::TestCliAgainstRealRegistry::test_stale_resolver_fence_does_not_change_the_skill_receipt tests/test_resolve_config.py::TestResolverCli::test_plugin_root_must_match_and_matching_symlink_is_allowed tests/test_script_io.py tests/test_assemble_artifacts.py::TestPlanSelfProof tests/test_parity_fixtures.py tests/test_await_workflow.py::TestResolveTarget tests/test_await_workflow.py::TestExitCodeContract tests/test_await_workflow.py::TestAttemptBounds tests/test_await_workflow.py::TestArtifactsOnlyOutcome tests/test_assemble_artifacts.py::TestEscapeHardenedPrimaryIsAcceptedUnchanged tests/test_agent_instruction_layout.py::TestCodexSizeCap tests/test_bundle_fresh.py"
          - mutation: b2-display-sep
            tests: "tests/test_collect_project_rules.py::TestDiscovery::test_windows_style_changed_entry_marks_nested_rule_modified tests/test_agent_instruction_layout.py::TestCollectorDedup"
          - mutation: c3-posixpath
            tests: "tests/test_contribution_surface.py::TestContractFenceHook"
          - mutation: d2-gcr-newline
            tests: "tests/test_generate_contract_requirements.py::TestCliAgainstRealRegistry::test_stale_resolver_fence_does_not_change_the_skill_receipt"
          - mutation: d1-stdio
            tests: "tests/test_resolve_config.py::TestResolverCli::test_plugin_root_must_match_and_matching_symlink_is_allowed tests/test_script_io.py tests/test_assemble_artifacts.py::TestPlanSelfProof tests/test_parity_fixtures.py"
          - mutation: a1-getuid
            tests: "tests/test_await_workflow.py::TestResolveTarget tests/test_await_workflow.py::TestExitCodeContract tests/test_await_workflow.py::TestAttemptBounds tests/test_await_workflow.py::TestArtifactsOnlyOutcome"
          - mutation: e-esm-uri
            tests: "tests/test_assemble_artifacts.py::TestEscapeHardenedPrimaryIsAcceptedUnchanged"
          - mutation: gitattributes
            tests: "tests/test_agent_instruction_layout.py::TestCodexSizeCap tests/test_bundle_fresh.py"
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - shell: bash
        run: pip install pytest==9.1.1
      - name: Apply mutation
        shell: bash
        run: python redproof.py "${{ matrix.mutation }}"
      - name: Focused tests (control must pass; every mutation must go red)
        shell: bash
        run: |
          set +e
          python -m pytest ${{ matrix.tests }} -q -rfEs -p no:cacheprovider --color=no
          rc=$?
          echo "pytest rc=$rc mutation=${{ matrix.mutation }}"
          if [ "${{ matrix.mutation }}" = control ]; then test $rc -eq 0; else test $rc -ne 0; fi
  skips:
    name: Windows skip reasons (full suite)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - shell: bash
        run: pip install pytest==9.1.1
      - shell: bash
        run: python -m pytest tests/ -q -rs -p no:cacheprovider --color=no
