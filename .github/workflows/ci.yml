name: CI - Tests and Linting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Windows path and interpreter probe (${{ matrix.setup }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        setup: ["stock-image", "setup-python"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.setup == 'setup-python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
      - name: Probe
        shell: bash
        run: |
          set +e
          section() { echo; echo "=== $1"; }
          section shell; uname -a; echo "BASH_VERSION=$BASH_VERSION MSYSTEM=$MSYSTEM OSTYPE=$OSTYPE"
          section pwd; pwd; pwd -W; echo "PWD=$PWD"
          section git-toplevel; git rev-parse --show-toplevel; git --version
          section interpreters
          for c in python3 python py; do echo "-- $c: $(command -v $c)"; done
          for c in python3 python "py -3"; do echo "-- $c -V:"; $c -V; echo "exit=$?"; done
          for c in python3 python "py -3"; do echo "-- $c version>=3.10 check:"; $c -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)'; echo "exit=$?"; done
          PY=python
          section msys-arg-conversion
          $PY -c 'import sys; print(sys.argv[1:])' /c/Users/x C:/Users/x 'C:\Users\x' --opt=/c/Users/x "/tmp/x"
          section python-paths
          $PY -c 'import os, sys, tempfile; print("cwd", os.getcwd()); print("realpath", os.path.realpath(".")); print("gettempdir", tempfile.gettempdir()); print("TEMP", os.environ.get("TEMP")); print("TMP", os.environ.get("TMP")); print("TMPDIR", os.environ.get("TMPDIR")); print("sys.executable", sys.executable)'
          section node-paths
          node -e 'const os=require("os"); console.log("tmpdir", os.tmpdir()); console.log("cwd", process.cwd())'
          section ensure_output_dir
          $PY scripts/ensure_output_dir.py; echo "exit=$?"
          section resolve_config
          $PY scripts/resolve_config.py --plugin-root "$(pwd)" 2>&1 | head -c 1500; echo "exit=$?"
          section resolve_config_W
          $PY scripts/resolve_config.py --plugin-root "$(pwd -W)" 2>&1 | head -c 600; echo "exit=$?"
          section recorder-native-outputdir
          OUT="$($PY -c 'import tempfile; print(tempfile.mkdtemp())')"
          echo "OUT=$OUT"
          node workflows/test/tools/emit_task_output.mjs "$OUT" 2>&1 | head -c 800; echo "exit=$?"
          section claude-install
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1; echo "npm exit=$?"
          claude --version; echo "exit=$?"
          command -v claude
