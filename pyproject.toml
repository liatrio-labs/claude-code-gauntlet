# Config + CI pin surface only — this is not a packaged project.
# No [project] / [build-system] on purpose (see #102 / AGENTS.md).
#
# This table pins the CI pytest stack. Lint-tool versions are pinned by the
# rev: fields in .pre-commit-config.yaml. Ruff is the one twin: the import-ban
# test runs it, and tests/test_ruff_import_boundary.py holds the two pins equal.
[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "coverage[toml]==7.15.2",
  "ruff==0.16.1",
]

[tool.coverage.run]
branch = true
# patch=["subprocess"] is load-bearing: without it pytest-cov does NOT measure the
# sys.executable child processes the suites spawn, and labels_diff / sync_agent_rules
# read 0% (aggregate collapses ~92%->85%). coverage.py >=7.10. See #102 requirement 8.
patch = ["subprocess"]
relative_files = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
omit = [
  "bench/vendor/*",
  "bench/tests/*",
  "bench/workspace/*",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["bench/vendor", "bench/workspace"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "BLE", "RUF", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"scripts".msg = "Import gauntlet modules from gauntlet.* instead."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059"]
"bench/tests/**" = ["RUF059"]

[tool.ruff.format]
# Intentionally unconfigured — ruff defaults (88 cols). Do not add line-length.

[tool.mypy]
python_version = "3.10"
files = ["conftest.py", "scripts", "tests", "bench", "workflows/test/tools"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "scripts"
exclude = "(?x)(^(bench/vendor|bench/workspace)/)"

[[tool.mypy.overrides]]
module = [
  "gauntlet.cli",
  "gauntlet.diff",
  "gauntlet.forge",
  "gauntlet.prior_review",
  "gauntlet.pr_identity",
  "gauntlet.marker",
  "gauntlet.paths",
  "gauntlet.jsjson",
  "gauntlet.markdown",
  "gauntlet.text",
  "gauntlet.delivery.fold",
  "gauntlet.numstat",
  "gauntlet.stale",
  "gauntlet.shared_context",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
