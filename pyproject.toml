# Config + CI pin surface only — this is not a packaged project.
# No [project] / [build-system] on purpose (see #102 / AGENTS.md).
#
# This table pins the CI pytest stack. Lint-tool versions are pinned by the
# rev: fields in .pre-commit-config.yaml — keep pins in their own home; do not
# duplicate either set here.
[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "coverage[toml]==7.15.2",
]

[tool.coverage.run]
branch = true
# patch=["subprocess"] is load-bearing: without it pytest-cov does NOT measure the
# sys.executable child processes the suites spawn, and labels_diff / sync_agent_rules
# read 0% (aggregate collapses ~92%->85%). coverage.py >=7.10. See #102 requirement 8.
patch = ["subprocess"]
relative_files = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
omit = [
  "bench/vendor/*",
  "bench/tests/*",
  "bench/workspace/*",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["bench/vendor", "bench/workspace"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059"]
"bench/tests/**" = ["RUF059"]

[tool.ruff.format]
# Intentionally unconfigured — ruff defaults (88 cols). Do not add line-length.

[tool.mypy]
python_version = "3.10"
files = ["scripts", "tests", "bench", "workflows/test/tools"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
explicit_package_bases = true
exclude = "(?x)(^(bench/vendor|bench/workspace)/)"

[[tool.mypy.overrides]]
module = [
  "apply_challenges",
  "apply_validations",
  "assemble_artifacts",
  "await_workflow",
  "detect_prior_review",
  "filter_findings",
  "finding_dedup",
  "merge_findings",
  "profile_run",
  "review_marker",
  "runner.*",
  "script_io",
  "verify_findings",
]
ignore_missing_imports = true
