<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 3006" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Code Gauntlet review pipeline in detail</title>
  <desc id="pipeline-desc">A GitHub pull request, GitLab merge request or local change is prepared in your session, then reviewed inside one Workflow call. On a full review seven specialist agents discover candidate findings in parallel; a light review, offered when every changed file is low risk and the change is under 50 lines, runs only the bug and security reviewers. A gap hunter agent then reads changed code that no specialist's finding pointed at, within a fixed read budget, and a coverage file records what the budget left out; light reviews skip it, and so do changes the specialists' findings already cover. Code merges the findings into one list and verifies each cited file, line and symbol against the source. An independent validator agent tries to disprove each finding and returns a fixed verdict, and on a confirmation writes the title, body and fix that would be posted. Code filters by verdict and removes known prompt-injection patterns, then admission requires each finding kind to carry the evidence it needs. A blind challenge by a fresh agent sees only the claim and its location. The two readers' verdicts are resolved into one final verdict and the confirming reader writes the posted comment. A confirmed present failure posts at its severity, a confirmed latent defect, or a defect in a test or standalone documentation, posts at low severity, comment wording or no practical effect stays in the local report, a refutation with a verified code citation drops the finding, and a finding not established is held back and listed as unverified. A security finding is dropped only when both readers refute it with verified citations. A group agent joins findings that one change would fix. Code ranks and selects the delivery set and renders the report, with incomplete checks in a separate unverified section, then hands the results back to your session. On an interactive run the session always saves a Markdown report, asks before posting inline comments to an open pull or merge request, and offers an optional task board. A headless run asks nothing, delivers to chat, Markdown or PR comments as configured, and defaults posting to dry-run.</desc>
