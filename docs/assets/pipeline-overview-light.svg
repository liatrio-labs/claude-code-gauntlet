<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Code Gauntlet pipeline overview</title>
  <desc id="pipeline-desc">The review pipeline for GitHub pull requests, GitLab merge requests, and local changes. Your session prepares the shared context: diff, project rules, risk triage, review scope, and related tests. Full review runs seven specialist reviewers in parallel: Bugs, Security, Cross-file impact, Tests, Conventions and intent, Type design, and Simplification. A light review, offered when every changed file is low risk and under 50 changed lines, runs only Bugs and Security. A gap hunter agent then reads changed regions no specialist cited, within a fixed read budget, and the report lists what the budget left out; light reviews and fully cited changes skip it. Findings pass through code that merges and removes duplicates, code that verifies each cited file, line and symbol against the source, an independent validator agent that tries to disprove each finding and returns a fixed verdict, and code that routes findings by verdict and removes prompt-injection patterns. Admission then requires each finding kind to carry the evidence it needs. A blind challenge by a fresh agent sees only the claim and its location, the two readers' verdicts are resolved into one, and the confirming reader writes the posted comment. A group agent joins findings that one change would fix without changing which findings survived. Code ranks and selects the delivery set and renders the report, and findings whose checks did not complete go to a separate unverified section. Your session then delivers: it saves the report first, asks before posting inline comments, and offers an optional task board; headless runs ask nothing and default to dry-run.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; fill: #1f2937; }
      .page { fill: #ffffff; }
      .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .agent-panel { fill: #f2f8f7; stroke: #aacbc3; stroke-width: 1.5; }
      .agent-node { fill: #ffffff; stroke: #aacbc3; stroke-width: 1.5; }
      .agent-stage { fill: #f2f8f7; stroke: #79a99d; stroke-width: 1.5; }
      .unverified-panel { fill: #f6f8fa; stroke: #9ba6b3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .title { font-size: 28px; font-weight: 650; letter-spacing: -0.5px; }
      .section { font-size: 23px; font-weight: 650; letter-spacing: -0.3px; }
      .stage-title { font-size: 23px; font-weight: 650; letter-spacing: -0.3px; }
      .challenge-title { font-size: 22px; font-weight: 650; letter-spacing: -0.3px; }
      .reviewer { font-size: 18px; font-weight: 600; text-anchor: middle; }
      .detail { font-size: 17px; fill: #526171; }
      .light-note { font-size: 15px; fill: #526171; }
      .light-mark { fill: #79a99d; }
      .muted { fill: #526171; }
      .kind { font-size: 15px; font-weight: 650; letter-spacing: 1.2px; fill: #526171; }
      .agent-kind { font-size: 15px; font-weight: 650; letter-spacing: 1.2px; fill: #216858; }
      .model { font-size: 15px; font-weight: 600; text-anchor: middle; fill: #216858; }
      .flow { fill: none; stroke: #647487; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .fan { fill: none; stroke: #79a99d; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .skipped { fill: none; stroke: #7b8898; stroke-width: 1.5; stroke-dasharray: 5 4; stroke-linecap: round; stroke-linejoin: round; }
      .divider { stroke: #d0d7de; stroke-width: 1.5; }
      .arrow { fill: #647487; }
      .skip-arrow { fill: #7b8898; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrow" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
    <marker id="skip-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="skip-arrow" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>

  <rect class="page" width="1200" height="1230"/>
  <text class="title" x="40" y="50">Code Gauntlet</text>
  <text class="muted" x="40" y="76">Adversarial code review</text>
  <text class="detail" x="1160" y="50" text-anchor="end">Full review shown</text>

  <rect class="panel" x="40" y="94" width="242" height="114" rx="10"/>
  <text class="section" x="60" y="128">Review target</text>
  <text class="detail" x="60" y="163">GitHub PR / GitLab MR</text>
  <text class="detail" x="60" y="188">Local changes</text>
  <path class="flow" d="M282 151 H316" marker-end="url(#arrow)"/>

  <rect class="panel" x="318" y="94" width="842" height="114" rx="10"/>
  <text class="section" x="338" y="128">Prepare shared context</text>
  <text class="detail" x="1140" y="128" text-anchor="end">Your session</text>
  <text x="338" y="163">Diff + project rules</text>
  <text class="detail" x="338" y="188">Risk triage</text>
  <text x="626" y="163">Full / incremental scope</text>
  <text x="914" y="163">Related tests</text>
  <path class="flow" d="M739 208 V246" marker-end="url(#arrow)"/>

  <rect class="agent-panel" x="40" y="248" width="1120" height="198" rx="10"/>
  <text class="section" x="60" y="279">Parallel discovery</text>
  <text class="detail" x="60" y="304">Full diff + codebase context</text>
  <text class="detail" x="1140" y="279" text-anchor="end">Context-pulling reviewers</text>
  <text class="light-note" x="1140" y="304" text-anchor="end">Light option: all files low risk + &lt;50 changed lines; Bugs + Security only</text>

  <path class="fan" d="M132 330 V318 H1068 V330 M288 318 V330 M444 318 V330 M600 318 V330 M756 318 V330 M912 318 V330"/>
  <rect class="agent-node" x="60" y="330" width="144" height="68" rx="7"/>
  <circle class="light-mark" cx="188" cy="343" r="4"/>
  <text class="reviewer" x="132" y="370">Bugs</text>
  <rect class="agent-node" x="216" y="330" width="144" height="68" rx="7"/>
  <circle class="light-mark" cx="344" cy="343" r="4"/>
  <text class="reviewer" x="288" y="358">Security</text>
  <text class="model" x="288" y="382">Opus</text>
  <rect class="agent-node" x="372" y="330" width="144" height="68" rx="7"/>
  <text class="reviewer" x="444" y="358">Cross-file</text>
  <text class="reviewer" x="444" y="382">impact</text>
  <rect class="agent-node" x="528" y="330" width="144" height="68" rx="7"/>
  <text class="reviewer" x="600" y="370">Tests</text>
  <rect class="agent-node" x="684" y="330" width="144" height="68" rx="7"/>
  <text class="reviewer" x="756" y="358">Conventions</text>
  <text class="reviewer" x="756" y="382">+ intent</text>
  <rect class="agent-node" x="840" y="330" width="144" height="68" rx="7"/>
  <text class="reviewer" x="912" y="358">Type</text>
  <text class="reviewer" x="912" y="382">design</text>
  <rect class="agent-node" x="996" y="330" width="144" height="68" rx="7"/>
  <text class="reviewer" x="1068" y="370">Simplification</text>
  <path class="fan" d="M132 398 V430 H1068 V398 M288 398 V430 M444 398 V430 M600 398 V430 M756 398 V430 M912 398 V430"/>

  <path class="flow" d="M140 430 V488" marker-end="url(#arrow)"/>
  <text class="detail" x="164" y="472">Candidate findings</text>

  <rect class="agent-stage" x="40" y="490" width="1120" height="90" rx="10"/>
  <text class="agent-kind" x="60" y="516">AGENT</text>
  <text class="stage-title" x="60" y="550">Gap hunter</text>
  <text class="detail" x="300" y="520">Reads changed regions no specialist cited, within a fixed read budget</text>
  <text class="detail" x="300" y="545">The report lists what the budget left out</text>
  <text class="light-note" x="300" y="568">Skipped for light reviews and when every change is already cited</text>
  <path class="flow" d="M171 580 V620" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="622" width="262" height="176" rx="10"/>
  <text class="kind" x="58" y="651">CODE</text>
  <text class="stage-title" x="58" y="688">Merge</text>
  <text class="detail" x="58" y="724">Remove duplicates</text>
  <text class="detail" x="58" y="750">Check the schema</text>
  <text class="detail" x="58" y="776">Credit each agent</text>
  <path class="flow" d="M302 710 H324" marker-end="url(#arrow)"/>
  <rect class="panel" x="326" y="622" width="262" height="176" rx="10"/>
  <text class="kind" x="344" y="651">CODE</text>
  <text class="stage-title" x="344" y="688">Verify</text>
  <text class="detail" x="344" y="724">Script checks the source</text>
  <text class="detail" x="344" y="750">Blame: new vs surfaced</text>
  <text class="detail" x="344" y="776">Failed check: kept, noted</text>
  <path class="flow" d="M588 710 H610" marker-end="url(#arrow)"/>
  <rect class="agent-stage" x="612" y="622" width="262" height="176" rx="10"/>
  <text class="agent-kind" x="630" y="651">AGENT</text>
  <text class="stage-title" x="630" y="688">Validate</text>
  <text class="detail" x="630" y="724">Tries to disprove each</text>
  <text class="detail" x="630" y="750">Verdict, not a score</text>
  <text class="detail" x="630" y="776">Writes title, body, fix</text>
  <path class="flow" d="M874 710 H896" marker-end="url(#arrow)"/>
  <rect class="panel" x="898" y="622" width="262" height="176" rx="10"/>
  <text class="kind" x="916" y="651">CODE</text>
  <text class="stage-title" x="916" y="688">Filter</text>
  <text class="detail" x="916" y="724">Routes by verdict</text>
  <text class="detail" x="916" y="750">Strips injection patterns</text>
  <text class="detail" x="916" y="776">Drops verified refutations</text>

  <path class="flow" d="M1029 798 V826 H171 V840" marker-end="url(#arrow)"/>
  <text class="detail" x="560" y="818">Surviving findings</text>
  <rect class="panel" x="40" y="842" width="262" height="176" rx="10"/>
  <text class="kind" x="58" y="871">CODE</text>
  <text class="stage-title" x="58" y="908">Admission</text>
  <text class="detail" x="58" y="944">Each finding kind lists</text>
  <text class="detail" x="58" y="970">the evidence it needs</text>
  <text class="detail" x="58" y="996">Missing: report or held</text>
  <path class="flow" d="M302 930 H324" marker-end="url(#arrow)"/>
  <rect class="agent-stage" x="326" y="842" width="262" height="176" rx="10"/>
  <text class="agent-kind" x="344" y="871">FRESH AGENT</text>
  <text class="challenge-title" x="344" y="908">Blind challenge</text>
  <text class="detail" x="344" y="944">Sees claim + location only</text>
  <text class="detail" x="344" y="970">Verdicts merged into one</text>
  <text class="detail" x="344" y="996">Confirmer writes comment</text>
  <path class="flow" d="M588 930 H610" marker-end="url(#arrow)"/>
  <rect class="agent-stage" x="612" y="842" width="262" height="176" rx="10"/>
  <text class="agent-kind" x="630" y="871">AGENT</text>
  <text class="stage-title" x="630" y="908">Group</text>
  <text class="detail" x="630" y="944">Joins findings one fix solves</text>
  <text class="detail" x="630" y="970">One comment per defect</text>
  <text class="detail" x="630" y="996">Never changes survivors</text>
  <path class="flow" d="M874 930 H896" marker-end="url(#arrow)"/>
  <rect class="panel" x="898" y="842" width="262" height="176" rx="10"/>
  <text class="kind" x="916" y="871">CODE</text>
  <text class="stage-title" x="916" y="908">Report</text>
  <text class="detail" x="916" y="944">Ranks and selects the set</text>
  <text class="detail" x="916" y="970">Renders the full report</text>
  <text class="detail" x="916" y="996">Unverified listed apart</text>

  <path class="flow" d="M960 1018 V1050 H700 V1068" marker-end="url(#arrow)"/>
  <text class="detail" x="720" y="1042">Ranked set</text>
  <path class="skipped" d="M1100 1018 V1068" marker-end="url(#skip-arrow)"/>
  <rect class="panel" x="40" y="1070" width="816" height="120" rx="10"/>
  <text class="section" x="60" y="1103">Delivery</text>
  <text class="detail" x="165" y="1103">Your session</text>
  <text class="detail" x="60" y="1136">Saves the report first</text>
  <text class="detail" x="60" y="1162">Headless: no asks, dry-run</text>
  <line class="divider" x1="405" x2="405" y1="1090" y2="1170"/>
  <text x="432" y="1100">Asks before posting</text>
  <text class="detail" x="432" y="1126">Inline comments only on yes</text>
  <text class="detail" x="432" y="1152">Optional task board</text>
  <text class="detail" x="432" y="1178">Mentions contained, tokens redacted</text>
  <rect class="unverified-panel" x="888" y="1070" width="272" height="120" rx="10"/>
  <text class="section" x="908" y="1103">Unverified findings</text>
  <text class="detail" x="908" y="1136">Incomplete checks</text>
  <text class="detail" x="908" y="1162">Separate report section</text>
</svg>
