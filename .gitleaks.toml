# Golden-epoch manifests pin file contents by SHA-256; a digest beside a file named
# after a vendor (sentry, keycloak) reads to the default rules like an access token.
[extend]
useDefault = true

[[allowlists]]
description = "SHA-256 digests in golden-epoch manifests and the leak guard's identifier list"
paths = ['''^bench/golden/epochs/[^/]+/epoch\.json$''', '''^bench/golden/leak_identifiers\.json$''']
regexTarget = "match"
regexes = ['''"[0-9a-f]{64}"''']
