fail_fast: false
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint-fix
        # LICENSE and bench/golden are non-docs / byte-exact fixtures. CHANGELOG.md is
        # rewritten by python-semantic-release on every release commit (which carries the
        # skip-ci token, so CI never sees it); the default template leaves an MD012 double
        # blank before the previous version heading, and every subsequent PR's merge-with-
        # main lint run then fails on that generated nit. Exclude the generated file rather
        # than keep re-fixing it on unrelated PRs.
        exclude: "LICENSE|^bench/golden/|^CHANGELOG\\.md$"

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v9.7.0
    hooks:
      - id: cspell
        name: spell check user-facing docs with cspell
        files: ^(README\.md|CONTRIBUTING\.md|CODE_OF_CONDUCT\.md|SECURITY\.md|docs/maintainer-issues\.md|\.github/pull_request_template\.md)$

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.23.0
    hooks:
      - id: commitlint
        name: lint commit message for Conventional Commits compliance
        additional_dependencies:
          - '@commitlint/config-conventional'
        stages: [commit-msg]
        args:
          - "--extends=@commitlint/config-conventional"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks
        name: scan for committed secrets with gitleaks
        args:
          - "--redact"

  - repo: local
    hooks:
      - id: pytest
        name: run pytest test suite
        entry: python -m pytest tests/ -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      # The hook above is scoped `types: [python]`, so a CLAUDE.md-only commit never
      # fires it — and CLAUDE.md-only commits are exactly how this file grows. This
      # runs the budget test at commit time for local feedback; CI's unconditional
      # pytest job is the check that cannot be skipped (issue #46).
      #
      # Use stdlib unittest — NOT pytest. CI's lint job installs only pre-commit
      # (ci.yml `lint`), so `python -m pytest` fails with "No module named pytest"
      # on every `pre-commit run --all-files` there. unittest is always available.
      - id: claude-md-budget
        name: CLAUDE.md stays within its byte budget
        entry: python -m unittest tests.test_claude_md_budget
        language: system
        files: ^CLAUDE\.md$
        pass_filenames: false
